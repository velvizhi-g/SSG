<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Registration Form</h1><br><br>

    <label>Roll no:</label>
    <input type="text"><br><br>
    <label>Student name :</label>
    <input type="text" placeholder="First Name"><br><br>
    <label>Father's name :</label>
    <input type="text"><br><br>
    <label>Date of birth :</label>
    <input type="date"><br><br>
    <label>Mobile no:</label>
    <input type="integer"><br><br> 
    <label>Email id :</label>
    <input type="email"><br><br>
    <label>Password :</label>
    <input type="password"><br><br>
    <label>Gender :</label>
    <input type="radio" name="gender">
    <label>Male</label>
    <input type="radio" name="gender">
    <label>Female</label><br><br>
    <label>Department :</label>
    <input type="checkbox" id="cse">
    <label for="cse">CSE</label>
    <input type="checkbox" id="it">
    <label for="it">IT</label>
    <input type="checkbox" id="ece">
    <label for="ece">ECE</label>
    <input type="checkbox" id="civil">
    <label for="civil">Civil</label>
    <input type="checkbox" id="mech">
    <label for="mech">Mech</label><br><br>
    <label>Course :</label>
    <select>
    <option>Computer Science</option>
    <option>Information Technology</option>
    <option>Electronics and Communication</option>
    <option>Civil Engineering</option>
    <option>Mechanical Engineering</option><br><br>
    </select><br><br>
    <label>Student photo :</label>
    <input type="file"><br><br>
    <label>City :</label>
    <input type="text"><br><br>
    <label>Address :</label>
    <textareaplaceholder="enter your address"></textarea>
</body>
</html>
